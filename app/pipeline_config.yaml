# ==========================================
# Cobblestone Energy Pipeline Configuration
# ==========================================
ingestion:
  start_date: "2023-01-01"
  end_date: "2026-05-22"
  timezone: "Europe/Paris"
  country_code: "FR"
  expected_columns:
      - price_fr
      - Forecasted Load
      - Solar
      - Wind Offshore
      - Wind Onshore
      - temperature_2m
      - wind_speed_120m
      - is_holiday
  
  meteo:
    url: "https://historical-forecast-api.open-meteo.com/v1/forecast"
    latitude: 48.8534
    longitude: 2.3488
    hourly_variables:
      - "temperature_2m"
      - "wind_speed_120m"

  output_paths:
    entsoe: "data/entsoe_data.csv"
    meteo: "data/weather_data.csv"
    holidays: "data/holidays_data.csv"
    dataset: "outputs/dataset/dataset.csv"

features:
  target_col: "price_fr"
  country_code: "FR"
  # Lag settings matched to your explicit lag requests (24, 48, 168)
  lags: [24, 48, 168]
  native_categorical_cols: ["hour", "day_of_week", "month", "quarter", "is_weekend"]
  features_to_drop: ["day_of_year"]
  
  output_paths:
    training_set: "outputs/dataset/training_set.csv"
    testing_set: "outputs/dataset/testing_set.csv"

modeling:
  boundaries:
    train_start: "2023-01-08 00:00:00"
    train_end: "2025-12-31 23:00:00"
    oos_start: "2026-01-01 00:00:00"
    oos_end: "2026-05-22 23:00:00"

  eex_trading_price: 46.75

  lightgbm:
    n_estimators: 1500
    early_stopping_rounds: 50
    split_ratio: 0.8  # 80/20 train/val split for Optuna

  optuna:
    n_trials: 30
    learning_rate: [0.01, 0.1]
    lambda_l1: [0.001, 10.0]
    lambda_l2: [0.001, 10.0]
    paradigm_b:
      num_leaves: [31, 127]
      max_depth: [6, 12]
      min_data_in_leaf: [20, 100]
    paradigm_a:
      num_leaves: [15, 63]
      max_depth: [4, 8]
      min_data_in_leaf: [10, 50]

  output_paths:
    train_split_dir: "outputs/train_test_split/"
    learning_curves_dir_b: "outputs/learning_curves/paradigm_b/"
    learning_curves_dir_a: "outputs/learning_curves/paradigm_a/"
    optimisation_logs_dir_b: "outputs/optimisation_logs/paradigm_b/"
    optimisation_logs_dir_a: "outputs/optimisation_logs/paradigm_a/"
    feature_importances_dir: "outputs/feature_importances/"
    evaluation_dir: "outputs/evaluation/"
    highlights_dir: "outputs/evaluation/highlights/"

llm_agent:
  # Define the scope of the batch execution
  paradigms: 
    # - "paradigm_a"
    - "paradigm_b"
  days: 
    - "day_1"
    # - "day_2"
    # - "day_3"
    
  # Gemini API settings
  model: "gemini-2.5-flash"
  temperature: 0.0
  
  # I/O Pathing templates
  input_template: "outputs/evaluation/highlights/{paradigm}/worst_performing_days/{day}_diagnostics*.json"
  output_dir: "outputs/llm_integration/"
